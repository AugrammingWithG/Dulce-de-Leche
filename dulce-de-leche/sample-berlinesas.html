const speckGeo = new THREE.IcosahedronGeometry(1, 0);
// Lumpy little solids for sugar clumps and biscuit crumbs: a few shapes, each one knocked out of round.

const CLUMPS = lumps(1, .25), CRUMBS = lumps(0, .45);

function berlinesa(kind) {

    o.position.copy(v); o.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3)); const s = rand(.0016, .0045); o.scale.set(s, s * .5, s * rand(.7, 1.3)); o.updateMatrix(); im.setMatrixAt(i, o.matrix); }

/* ---------------- The board and the table ---------------- */
const BOARD_R = 1.2, BOARD_T = .062;
let rim, top; // the board's edge and face, re-dressed once the photographed wood arrives
const LAYOUT = [['custard', 0, 0]];
['dulce', 'biscoff', 'choc', 'dulce', 'biscoff'].forEach((k, i) => { const a = i / 5 * Math.PI * 2 + .45 + rand(-.12, .12), d = .69 + rand(-.03, .03); LAYOUT.push([k, Math.cos(a) * d, Math.sin(a) * d]); });
LAYOUT[0][1] += rand(-.04, .04); LAYOUT[0][2] += rand(-.04, .04);
// The board's face: a photographed oak veneer when it has loaded (cropped to a board-sized piece), painted grain until then.
const WOOD_CROP = .55;
function woodTop(photo) {
  const S = 2048, [c, g] = makeCanvas(S); g.fillStyle = '#B88C58'; g.fillRect(0, 0, S, S);
  if (photo) { g.drawImage(photo, 0, 0, photo.width * WOOD_CROP, photo.height * WOOD_CROP, 0, 0, S, S); g.globalAlpha = .12; g.fillStyle = '#F2D9B0'; g.fillRect(0, 0, S, S); }
  else {
  g.globalAlpha = .5; g.drawImage(tinted(NZ.lo, '#E3BF8C'), 0, 0, S, S); g.globalAlpha = .25; g.drawImage(tinted(NZ.mid, '#B98852'), 0, 0, S, S);
  // Grain: long wavy lines across the board, with a few darker growth lines.
  for (let i = 0; i < 320; i++) { const y0 = rnd() * S, dark = rnd() < .18; g.strokeStyle = dark ? '#94653A' : (rnd() < .5 ? '#B5844F' : '#E2C08F'); g.globalAlpha = dark ? rand(.18, .32) : rand(.06, .18); g.lineWidth = dark ? rand(1.5, 4) : rand(.6, 2.4);
    const f = rand(.6, 1.6), ph = rand(0, 6), amp = rand(4, 16); g.beginPath(); for (let x = -10; x <= S + 10; x += 16) { const y = y0 + Math.sin(x / S * Math.PI * 2 * f + ph) * amp + (vnoise(x * .004, y0 * .01, 3) - .5) * 30; x < 0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 5000; i++) { const x = rnd() * S, y = rnd() * S; g.strokeStyle = rnd() < .5 ? '#A47546' : '#E8CA9C'; g.globalAlpha = rand(.04, .12); g.lineWidth = rand(.5, 1.2); g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(8, 40), y + rand(-1, 1)); g.stroke(); }
  // Knife marks from years of use.
  }
  for (let i = 0; i < 70; i++) { const x = rnd() * S, y = rnd() * S, a = rand(0, 6.283), l = rand(40, 260); g.strokeStyle = rnd() < .6 ? '#F1DCBC' : '#8E6136'; g.globalAlpha = rand(.06, .16); g.lineWidth = rand(.5, 1.4); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }

const scene = new THREE.Scene();

Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 1, far: 16 }); scene.add(key);

/* ---------------- Camera, controls and the photographic finish ---------------- */
const camera = new THREE.PerspectiveCamera(30, 1, .05, 60);

const bokeh = new BokehPass(scene, camera, { focus: 4, aperture: .0045, maxblur: .0045 }); composer.addPass(bokeh);
// A faint glow off the brightest sugar, like a real lens.
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), .14, .5, .82));
composer.addPass(new OutputPass());
// Grade and lens: a little more saturation, cool shadows, a hair of colour fringing towards the corners, vignette and grain.
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },

  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;

    void main(){

      c.rgb = mix(vec3(l), c.rgb, 1.16);
      c.rgb = mix(c.rgb, c.rgb * vec3(.88, .96, 1.16), (1. - smoothstep(.04, .45, l)) * .55);

const target = new THREE.Vector3();
function frame() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h);
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * aspect);
  const dist = Math.max(1.42 / Math.tan(hf), 1.12 / Math.tan(vf));
  // On a phone the copy sits on top, so the board drops lower in the frame.
  target.set(LOOK[0], .14, LOOK[1] + (aspect < .9 ? -.55 : aspect < 1.25 ? -.2 : 0));

}
// Capture aids: ?zoom=.4 starts close up, ?look=x,z aims the camera at a spot on the board.
const ZOOM = +params.get('zoom') || 1, LOOK = (params.get('look') || '0,0').split(',').map(Number);
let dist = frame();
const polar = .62, az = .35;
controls.target.copy(target);
camera.position.set(target.x + Math.sin(polar) * Math.sin(az) * dist, target.y + Math.cos(polar) * dist, target.z + Math.sin(polar) * Math.cos(az) * dist);
controls.minDistance = dist * .5; controls.maxDistance = dist * 1.4;
addEventListener('resize', () => { const d = frame(), dir = camera.position.clone().sub(controls.target).normalize(); controls.target.copy(target); camera.position.copy(target).addScaledVector(dir, d); controls.minDistance = d * .5; controls.maxDistance = d * 1.4; });

const clock = new THREE.Clock();
function loop() {
  controls.update();
  bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target) - .1;
  finish.uniforms.uTime.value = clock.getElapsedTime() % 10;
  composer.render();
  requestAnimationFrame(loop);
}
loop();

// Photographed oak and a real studio's light (Poly Haven, CC0). Browsers won't hand images from a file:// page to WebGL,
// so a copy opened straight from disk keeps the painted wood and the generated room.
const tex = f => new THREE.TextureLoader().loadAsync('textures/' + f);
const photos = location.protocol === 'file:' ? Promise.resolve(null) : Promise.race([
  Promise.all([new RGBELoader().loadAsync('textures/studio_1k.hdr'), tex('oak_diff.jpg'), tex('oak_nor.jpg'), tex('oak_rough.jpg'), tex('floor_herringbone.jpg')]),
  new Promise(r => setTimeout(r, 15000, null)),
]).catch(() => null);
photos.then(got => {
  if (!got) return;
  const [hdr, diff, nor, rough, floor] = got;
  hdr.mapping = THREE.EquirectangularReflectionMapping; scene.environment = hdr; scene.environmentIntensity = .34; scene.environmentRotation.y = 2.2;
  for (const t of [nor, rough]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(WOOD_CROP, WOOD_CROP); t.offset.set(0, 1 - WOOD_CROP); t.anisotropy = ANISO; }

  Object.assign(top.material, { map: face, normalMap: nor, normalScale: new THREE.Vector2(.7, .7), roughnessMap: rough, roughness: 1, bumpMap: null }); top.material.needsUpdate = true;
  diff.colorSpace = THREE.SRGBColorSpace; diff.wrapS = diff.wrapT = THREE.RepeatWrapping; diff.repeat.set(4, .05); diff.anisotropy = ANISO;
  rim.material.map = diff; rim.material.needsUpdate = true;
  // Herringbone parquet under the board; the same photo, read as height, sinks the dark seams and grain.
  const floorH = floor.clone(); floorH.needsUpdate = true;
  for (const t of [floor, floorH]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); t.anisotropy = ANISO; }
  floor.colorSpace = THREE.SRGBColorSpace;
  Object.assign(table.material, { map: floor, bumpMap: floorH, bumpScale: 1.2, roughness: .58 }); table.material.needsUpdate = true;
}).finally(() => requestAnimationFrame(() => document.documentElement.classList.add('ready')));
