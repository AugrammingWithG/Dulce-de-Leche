    const line = piped(slitLine(), .036, kind === 'dulce' ? MAT.dulce : MAT.chocCream); g.add(line); fills.push(line);
    if (kind === 'dulce') { const stick = new THREE.Mesh(new THREE.CylinderGeometry(.01, .01, .22, 20), MAT.chocolate); stick.position.set(.07, TOP + .06, .01); stick.rotation.set(rand(-.2, .2), rand(-.4, .4), 1.0); g.add(stick); fills.push(stick); }
    else { const s = shard(); s.position.set(-.03, TOP + .06, 0); s.rotation.set(-.25, rand(-.5, .5), .35); g.add(s); fills.push(s); }
    dustOver(fills, 900, .23, .1, g);
  } else if (kind === 'biscoff') {
    const ros = swirl(.1, .1, .036, MAT.biscoffCream); g.add(ros); fills.push(ros);
    const b = biscuit(); b.position.set(0, TOP + .11, -.02); b.rotation.set(-.24, rand(-.3, .3), rand(-.1, .1)); g.add(b); fills.push(b.children[0]);
    const crumbGeo = new THREE.IcosahedronGeometry(1, 1), cr = new THREE.InstancedMesh(crumbGeo, MAT.biscuit, 60), q = new THREE.Object3D();
    for (let i = 0; i < 60; i++) { const a = rand(0, 6.283), r = rand(.1, .17); q.position.set(Math.cos(a) * r, domeY(r) + .002, Math.sin(a) * r); q.rotation.set(rand(0, 3), rand(0, 3), 0); const s = rand(.003, .009); q.scale.set(s * rand(1, 1.6), s * .5, s); q.updateMatrix(); cr.setMatrixAt(i, q.matrix); }
    g.add(cr); dustOver(fills, 450, .16, .16, g);
  } else if (kind === 'custard') {
    const cu = swirl(.11, .12, .04, MAT.custard, 2.2); g.add(cu); fills.push(cu);
    dustOver(fills, 450, .16, .16, g);
  }
  g.traverse(m => { if (m.isMesh && !m.isInstancedMesh) { m.castShadow = true; m.receiveShadow = true; } });
  return g;
}

/* ---------------- The board and the table ---------------- */
const BOARD_R = 1.2, BOARD_T = .062;
const LAYOUT = [['custard', 0, 0]];
['dulce', 'biscoff', 'choc', 'dulce', 'biscoff'].forEach((k, i) => { const a = i / 5 * Math.PI * 2 + .45 + rand(-.12, .12), d = .69 + rand(-.03, .03); LAYOUT.push([k, Math.cos(a) * d, Math.sin(a) * d]); });
LAYOUT[0][1] += rand(-.04, .04); LAYOUT[0][2] += rand(-.04, .04);
function woodTop() {
  const S = 2048, [c, g] = makeCanvas(S); g.fillStyle = '#B88C58'; g.fillRect(0, 0, S, S);
  g.globalAlpha = .5; g.drawImage(tinted(NZ.lo, '#E3BF8C'), 0, 0, S, S); g.globalAlpha = .25; g.drawImage(tinted(NZ.mid, '#B98852'), 0, 0, S, S);
  // Grain: long wavy lines across the board, with a few darker growth lines.
  for (let i = 0; i < 320; i++) { const y0 = rnd() * S, dark = rnd() < .18; g.strokeStyle = dark ? '#94653A' : (rnd() < .5 ? '#B5844F' : '#E2C08F'); g.globalAlpha = dark ? rand(.18, .32) : rand(.06, .18); g.lineWidth = dark ? rand(1.5, 4) : rand(.6, 2.4);
    const f = rand(.6, 1.6), ph = rand(0, 6), amp = rand(4, 16); g.beginPath(); for (let x = -10; x <= S + 10; x += 16) { const y = y0 + Math.sin(x / S * Math.PI * 2 * f + ph) * amp + (vnoise(x * .004, y0 * .01, 3) - .5) * 30; x < 0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); }
  for (let i = 0; i < 5000; i++) { const x = rnd() * S, y = rnd() * S; g.strokeStyle = rnd() < .5 ? '#A47546' : '#E8CA9C'; g.globalAlpha = rand(.04, .12); g.lineWidth = rand(.5, 1.2); g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(8, 40), y + rand(-1, 1)); g.stroke(); }
  // Knife marks from years of use.
  for (let i = 0; i < 70; i++) { const x = rnd() * S, y = rnd() * S, a = rand(0, 6.283), l = rand(40, 260); g.strokeStyle = rnd() < .6 ? '#F1DCBC' : '#8E6136'; g.globalAlpha = rand(.06, .16); g.lineWidth = rand(.5, 1.4); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  // Icing sugar that fell off the berlinesas: a soft haze and loose grains around each one.
  const px = v => (v / BOARD_R + 1) / 2 * S;
  for (const [, x, z] of LAYOUT) {
    const cx = px(x), cy = px(z), rr = R / BOARD_R / 2 * S;
    const gr = g.createRadialGradient(cx, cy, rr * .7, cx, cy, rr * 1.7); gr.addColorStop(0, 'rgba(255,252,246,.55)'); gr.addColorStop(.45, 'rgba(255,252,246,.2)'); gr.addColorStop(1, 'rgba(255,252,246,0)');
    g.globalAlpha = 1; g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rr * 1.7, 0, 7); g.fill();
    g.fillStyle = '#FFFDF8'; for (let i = 0; i < 2600; i++) { const a = rand(0, 6.283), d = rr * (.8 + Math.pow(rnd(), 1.8) * 1.2); g.globalAlpha = rand(.25, .9) * (1 - (d / rr - .8) / 1.3); g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rand(.6, 2.2), 0, 7); g.fill(); }
  }
  g.fillStyle = '#FFFDF8'; for (let i = 0; i < 6000; i++) { g.globalAlpha = rand(.1, .45); g.beginPath(); g.arc(rnd() * S, rnd() * S, rand(.5, 1.4), 0, 7); g.fill(); }
  g.globalAlpha = 1; return c;
}
function board() {
  const g = new THREE.Group();
  const rimProfile = [[0, 0], [BOARD_R - .03, 0], [BOARD_R - .006, .006], [BOARD_R, .022], [BOARD_R, .042], [BOARD_R - .006, .056], [BOARD_R - .022, BOARD_T], [BOARD_R - .03, BOARD_T]].map(([x, y]) => new THREE.Vector2(x, y));
  const [rc, rg] = makeCanvas(512); rg.fillStyle = '#C49A66'; rg.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 90; i++) { const x = rnd() * 512; rg.strokeStyle = rnd() < .5 ? '#9C6E40' : '#DDB98A'; rg.globalAlpha = rand(.1, .3); rg.lineWidth = rand(1, 4); rg.beginPath(); rg.moveTo(x, 0); rg.lineTo(x + rand(-10, 10), 512); rg.stroke(); }
  const rim = new THREE.Mesh(new THREE.LatheGeometry(rimProfile, 200), new THREE.MeshStandardMaterial({ map: texOf(rc, 10, 1), roughness: .62 }));
  const topTex = texOf(woodTop(), 1, 1); topTex.wrapS = topTex.wrapT = THREE.ClampToEdgeWrapping;
  const top = new THREE.Mesh(new THREE.CircleGeometry(BOARD_R - .021, 200), new THREE.MeshStandardMaterial({ map: topTex, roughness: .66, bumpMap: texOf(noiseCanvas(512, 30, 3, 1.4), 4, 4, false), bumpScale: .6 }));
  top.rotation.x = -Math.PI / 2; top.position.y = BOARD_T + .0004;
  rim.castShadow = true; rim.receiveShadow = true; top.receiveShadow = true; g.add(rim, top);
  // Loose grains of sugar with real depth, near the berlinesas.
  const n = 1100, im = new THREE.InstancedMesh(speckGeo, MAT.sugar, n), o = new THREE.Object3D();
  for (let i = 0; i < n; i++) { const [, x, z] = LAYOUT[i % LAYOUT.length], a = rand(0, 6.283), d = R * (.95 + Math.pow(rnd(), 2.5) * .6);
    o.position.set(x + Math.cos(a) * d, BOARD_T + .001, z + Math.sin(a) * d); o.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
    const s = Math.hypot(o.position.x, o.position.z) > BOARD_R - .04 ? 0 : rand(.0012, .0028); o.scale.set(s, s * .45, s); o.updateMatrix(); im.setMatrixAt(i, o.matrix); }
  g.add(im);
  return g;
}

/* ---------------- Scene ---------------- */
const scene = new THREE.Scene();
const BG = new THREE.Color(0x151211); scene.background = BG; scene.fog = new THREE.Fog(BG, 7, 15);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .38;
scene.add(new THREE.HemisphereLight(0xFFF4E6, 0x2A2420, .25));
const key = new THREE.DirectionalLight(0xFFEBD2, 2.7); key.position.set(-2.4, 6.5, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 12; key.shadow.blurSamples = 24; key.shadow.bias = -.0004;
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 1, far: 16 }); scene.add(key);
const back = new THREE.DirectionalLight(0xFFD7A8, .9); back.position.set(3, 2.6, -3.4); scene.add(back);
const [sc] = makeCanvas(512); { const g = sc.getContext('2d'); g.fillStyle = '#2B2826'; g.fillRect(0, 0, 512, 512); g.globalAlpha = .55; g.drawImage(tinted(NZ.lo, '#1E1C1B'), 0, 0); g.globalAlpha = .35; g.drawImage(tinted(NZ.hi, '#3A3633'), 0, 0); }
const table = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: texOf(sc, 10, 10), roughness: .88, bumpMap: texOf(noiseCanvas(256, 24, 3, 1.5), 10, 10, false), bumpScale: .8 }));
table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
scene.add(board());
for (const [kind, x, z] of LAYOUT) { const b = berlinesa(kind); b.position.set(x, BOARD_T - .004, z); b.rotation.y = rand(0, 6.283); b.scale.setScalar(rand(.96, 1.04)); scene.add(b); }

/* ---------------- Camera, controls and the photographic finish ---------------- */
const camera = new THREE.PerspectiveCamera(30, 1, .05, 60);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: .06, enablePan: false, minPolarAngle: .2, maxPolarAngle: 1.15, autoRotate: !still, autoRotateSpeed: .35, rotateSpeed: .6, zoomSpeed: .6 });
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: .22, distanceExponent: 1.5, thickness: 1.5, scale: 1.1, samples: small ? 12 : 16 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
gtao.blendIntensity = .9; composer.addPass(gtao);
const bokeh = new BokehPass(scene, camera, { focus: 4, aperture: .0045, maxblur: .0045 }); composer.addPass(bokeh);
composer.addPass(new OutputPass());
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5; c.rgb *= 1. - .38 * smoothstep(.28, .9, length(d * vec2(1.15, 1.))); c.rgb += (h(vUv * 1000. + uTime) - .5) * .028; gl_FragColor = c; }',
});
composer.addPass(finish);

const target = new THREE.Vector3();
function frame() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h);
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * aspect);
  const dist = Math.max(1.42 / Math.tan(hf), 1.12 / Math.tan(vf));
  // On a phone the copy sits on top, so the board drops lower in the frame.
  target.set(LOOK[0], .14, LOOK[1] + (aspect < .9 ? -.55 : aspect < 1.25 ? -.2 : 0));
  return dist * ZOOM;
}
// Capture aids: ?zoom=.4 starts close up, ?look=x,z aims the camera at a spot on the board.
const ZOOM = +params.get('zoom') || 1, LOOK = (params.get('look') || '0,0').split(',').map(Number);
let dist = frame();
const polar = .62, az = .35;
controls.target.copy(target);
camera.position.set(target.x + Math.sin(polar) * Math.sin(az) * dist, target.y + Math.cos(polar) * dist, target.z + Math.sin(polar) * Math.cos(az) * dist);
controls.minDistance = dist * .5; controls.maxDistance = dist * 1.4;
addEventListener('resize', () => { const d = frame(), dir = camera.position.clone().sub(controls.target).normalize(); controls.target.copy(target); camera.position.copy(target).addScaledVector(dir, d); controls.minDistance = d * .5; controls.maxDistance = d * 1.4; });

const clock = new THREE.Clock();
function loop() {
  controls.update();
  bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target) - .1;
  finish.uniforms.uTime.value = clock.getElapsedTime() % 10;
  composer.render();
  requestAnimationFrame(loop);
}
loop();
requestAnimationFrame(() => document.documentElement.classList.add('ready'));
</script>
